spin_manifest_version = 2

[application]
authors = ["Yiwen Ding <dingywn@seas.upenn.edu>"]
description = "Spin PostgreSQL + KV + Redis prototype on Akamai Functions"
name = "quay-prototype"
version = "0.1.0"
targets = ["akamai-functions"]

[variables]
pg_connection_string = { required = true }
redis_connection_string = { default = "redis://localhost:6379" }

[[trigger.http]]
route = "/..."
component = "quay-prototype"

[component.quay-prototype]
source = "dist/quay-prototype.wasm"
exclude_files = ["**/node_modules"]
allowed_outbound_hosts = [
    "postgres://ep-royal-grass-axm820dc.c-4.us-east-2.aws.neon.tech:5432",
    "redis://*:*",
]
key_value_stores = ["default"]

[component.quay-prototype.variables]
pg_connection_string = "{{ pg_connection_string }}"
redis_connection_string = "{{ redis_connection_string }}"

[component.quay-prototype.build]
command = ["npm install", "npm run build"]
watch = ["src/**/*.ts"]
